<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23FFD02F'/><text x='50' y='68' font-size='60' text-anchor='middle' font-family='monospace' font-weight='900'>H</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoyo — Game Account Manager</title>
    <script>
      (function () {
        var t = localStorage.getItem("hoyo-theme");
        if (t === "dark") document.documentElement.classList.add("dark");
        else if (t === "light") document.documentElement.classList.remove("dark");
        else if (window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
